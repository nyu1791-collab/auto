<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>刹那 — Just-Dodge Duel</title>
    <style>
      :root {
        color-scheme: dark;
      }

      * {
        -webkit-tap-highlight-color: transparent;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
      }

      body {
        background: #0b0d10;
        color: #e6e6e6;
        font-family: system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100dvh;
        user-select: none;
        overscroll-behavior: none;
      }

      /* ゲーム全体を包むコンテナ。ビューポートいっぱいに広がり、
         中央に 16:9 のキャンバスを保持する。 */
      .game-shell {
        position: relative;
        width: 100%;
        max-width: 100vw;
        max-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        touch-action: none;
      }

      /* キャンバスとタッチ操作 UI を重ねるためのラッパー。
         800:450 (16:9) の比率を保ったまま画面に収まる最大サイズを取る。 */
      .game-viewport {
        position: relative;
        overflow: hidden;
        width: min(100vw, calc(100dvh * 16 / 9));
        height: min(100dvh, calc(100vw * 9 / 16));
        max-width: 100%;
        touch-action: none;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
        background: #15181d;
        border: 1px solid #2a2f37;
        image-rendering: auto;
        touch-action: none;
      }

      .controls {
        font-size: 13px;
        color: #8a93a0;
        margin-top: 12px;
        text-align: center;
        padding: 0 12px;
      }

      /* タッチデバイスではキーボード操作のヒントを隠す */
      @media (pointer: coarse) {
        .controls {
          display: none;
        }
      }

      /* --- タッチ操作 UI ---------------------------------------------- */
      .touch-controls {
        display: none;
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 10;
      }

      .touch-controls.tc-visible {
        display: block;
      }

      .tc-btn {
        pointer-events: auto;
        touch-action: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        position: absolute;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.08);
        color: #e6e6e6;
        font-size: 18px;
        font-weight: bold;
        font-family: inherit;
        -webkit-user-select: none;
      }

      .tc-btn.tc-active {
        background: rgba(255, 255, 255, 0.28);
        border-color: rgba(255, 255, 255, 0.5);
      }

      /* --- メニュー行(上部) ------------------------------------------ */
      .tc-menu-row {
        position: absolute;
        top: env(safe-area-inset-top, 0px);
        left: env(safe-area-inset-left, 0px);
        right: env(safe-area-inset-right, 0px);
        display: flex;
        justify-content: center;
        gap: 8px;
        padding: 6px;
      }

      .tc-menu-row .tc-btn {
        position: relative;
        width: auto;
        min-width: 44px;
        height: 32px;
        padding: 0 10px;
        border-radius: 16px;
        font-size: 12px;
        font-weight: normal;
        background: rgba(0, 0, 0, 0.35);
      }

      /* --- P1 / P2 操作クラスタ --------------------------------------- */
      /* デフォルト(VS CPU = 1人プレイ)では P1 クラスタを画面全幅に広げ、
         移動ボタンを左端・アクションボタンを右端へ大きく離して配置する。
         VS PLAYER(2P対戦)に切り替えると `tc-two-player` が付与され、
         左右半分ずつに戻る(対面プレイ用)。 */
      .tc-cluster {
        position: absolute;
        bottom: env(safe-area-inset-bottom, 0px);
        width: 100%;
        height: 45%;
        pointer-events: none;
      }

      .touch-controls.tc-two-player .tc-cluster {
        width: 50%;
      }

      .tc-p1 {
        left: env(safe-area-inset-left, 0px);
      }

      .tc-p2 {
        right: env(safe-area-inset-right, 0px);
      }

      .tc-p2.tc-hidden {
        display: none;
      }

      /* P1: 左下に移動(◀▶)、右下にアクションボタン群(回避・ジャンプ・弱・強) */
      .tc-p1 .tc-left {
        left: 12px;
        bottom: 14px;
        width: 56px;
        height: 56px;
      }

      .tc-p1 .tc-right {
        left: 76px;
        bottom: 14px;
        width: 56px;
        height: 56px;
      }

      .tc-p1 .tc-dodge {
        right: 88px;
        bottom: 82px;
        width: 64px;
        height: 64px;
        font-size: 14px;
        background: rgba(77, 166, 255, 0.18);
        border-color: rgba(77, 166, 255, 0.5);
      }

      .tc-p1 .tc-jump {
        right: 16px;
        bottom: 82px;
        width: 64px;
        height: 64px;
        font-size: 12px;
        background: rgba(120, 230, 160, 0.18);
        border-color: rgba(120, 230, 160, 0.5);
      }

      .tc-p1 .tc-light {
        right: 90px;
        bottom: 14px;
        width: 52px;
        height: 52px;
      }

      .tc-p1 .tc-heavy {
        right: 18px;
        bottom: 14px;
        width: 52px;
        height: 52px;
      }

      /* P2: 左右反転した配置(対面プレイ用) */
      .tc-p2 .tc-left {
        right: 76px;
        bottom: 14px;
        width: 56px;
        height: 56px;
      }

      .tc-p2 .tc-right {
        right: 12px;
        bottom: 14px;
        width: 56px;
        height: 56px;
      }

      .tc-p2 .tc-dodge {
        left: 88px;
        bottom: 82px;
        width: 64px;
        height: 64px;
        font-size: 14px;
        background: rgba(255, 93, 93, 0.18);
        border-color: rgba(255, 93, 93, 0.5);
      }

      .tc-p2 .tc-jump {
        left: 16px;
        bottom: 82px;
        width: 64px;
        height: 64px;
        font-size: 12px;
        background: rgba(120, 230, 160, 0.18);
        border-color: rgba(120, 230, 160, 0.5);
      }

      .tc-p2 .tc-light {
        left: 90px;
        bottom: 14px;
        width: 52px;
        height: 52px;
      }

      .tc-p2 .tc-heavy {
        left: 18px;
        bottom: 14px;
        width: 52px;
        height: 52px;
      }

      /* --- 縦持ち回転案内 ---------------------------------------------- */
      .rotate-hint {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 100;
        background: #0b0d10;
        color: #e6e6e6;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 12px;
        padding: 24px;
        font-size: 16px;
      }

      .rotate-hint .icon {
        font-size: 48px;
      }

      /* coarse pointer(タッチ)端末が縦持ちのときだけ表示する。
         デスクトップの縦長ウィンドウでは表示しない。 */
      @media (pointer: coarse) and (orientation: portrait) {
        .rotate-hint {
          display: flex;
        }
      }
    </style>
  </head>
  <body>
    <div class="rotate-hint">
      <div class="icon">📱↻</div>
      <div>画面を横向きにしてください</div>
      <div style="font-size: 13px; color: #8a93a0">Please rotate your device to landscape</div>
    </div>
    <div class="game-shell">
      <div class="game-viewport" id="game-viewport">
        <canvas id="game" width="800" height="450"></canvas>
      </div>
    </div>
    <div class="controls">
      P1: A/D 移動 · W 回避 · Space ジャンプ(空中で二段ジャンプ可) · F 弱 · G 強 &nbsp;|&nbsp; P2: ←/→
      移動 · ↑ 回避 · Shift ジャンプ · K 弱 · L 強
      <br />
      C: CPU対戦 / 2P対戦 切替(デフォルトは CPU 対戦) &nbsp;|&nbsp; V:
      CPU難易度切替(デフォルト EASY → NORMAL → HARD) &nbsp;|&nbsp; H:
      ジャスト回避アシスト切替 &nbsp;|&nbsp; M: ミュート切替 &nbsp;|&nbsp; Enter: 試合終了後にリスタート
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
